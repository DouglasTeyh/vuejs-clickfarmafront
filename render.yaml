services:
  # ---------------------------------------------------------------------------
  # BACKEND (Spring Boot)
  # ---------------------------------------------------------------------------
  - type: web
    name: clickfarma-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/produtos/buscar
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: clickfarma-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: clickfarma-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: clickfarma-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: clickfarma-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: clickfarma-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: APP_BACKEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: ADMIN_EMAIL_1
        sync: false
      - key: ADMIN_PASSWORD_1
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: PORT
        value: 8080

  # ---------------------------------------------------------------------------
  # FRONTEND (Vue.js + Nginx)
  # ---------------------------------------------------------------------------
  - type: web
    name: clickfarma-frontend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile.frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: VUE_APP_API_URL
        value: /api

databases:
  - name: clickfarma-db
    databaseName: clickfarma
    user: clickfarma_user
    plan: free
