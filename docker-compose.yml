services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: clickfarma-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clickfarma}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clickfarma"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Java
  backend:
    image: maven:3.9.6-eclipse-temurin-17-alpine
    container_name: clickfarma-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /home/douglasteyh/.m2:/root/.m2
    command: mvn spring-boot:run -DskipTests
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-clickfarma}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY}
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect

    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Frontend Vue.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clickfarma-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pg-data:

networks:
  app-network:
    driver: bridge