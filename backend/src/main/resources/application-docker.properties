# Porta do servidor
server.port=${PORT:8080}

# Banco de Dados PostgreSQL (usando o nome do serviço 'db' do docker-compose ou DB_HOST do Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:clickfarma}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:clickfarmaSecretKey2026VeryLongSecretKeyForJWTGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Provider (groq ou gemini)
ai.provider=groq

# API Keys para IA (removed to avoid circular reference, Java code uses @Value fallbacks)

# OCR Space
ocr.space.api.key=${OCR_SPACE_API_KEY:}
ocr.space.api.url=https://api.ocr.space/parse/image
ocr.space.language=por
app.frontend.url=${APP_FRONTEND_URL:http://localhost}

