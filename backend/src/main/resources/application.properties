server.port=${PORT:8080}

# Timeout para OCR
spring.mvc.async.request-timeout=2m

# Banco de Dados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickfarma}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Segurança
jwt.secret=${JWT_SECRET:clickfarmaSecretKey2026VeryLongSecretKeyForJWTGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

# IA
ai.provider=${AI_PROVIDER:groq}
receita.ai.enabled=true

# API Keys
GEMINI_API_KEY=${GEMINI_API_KEY}
GROQ_API_KEY=${GROQ_API_KEY}

# OCR Space
ocr.space.api.key=${OCR_SPACE_API_KEY}
ocr.space.api.url=https://api.ocr.space/parse/image
ocr.space.language=por
ocr.space.isTable=false
ocr.space.preprocess=true

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

# Frontend URL para CORS
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8081}
app.backend.url=${APP_BACKEND_URL:}
app.webhook.url=${APP_WEBHOOK_URL:}

# SMTP (Brevo/Outros)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
